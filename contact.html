<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9019748114343101"
     crossorigin="anonymous"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9V3PMEN30B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-9V3PMEN30B');

  <title>お問い合わせ | 世界地図 — 国名暗記ツール</title>
  <meta name="description" content="「世界地図 — 国名暗記ツール」へのお問い合わせページです。" />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="legal.css" />
</head>
<body>
  <div class="legal-page">
    <a class="back-link" href="index.html">&larr; 地図に戻る</a>
    <h1>お問い合わせ</h1>
    <p>当サイトに関するご意見・ご質問・不具合のご報告は、以下のフォームよりお願いいたします。担当者が内容を確認のうえ、必要に応じてご記入いただいたメールアドレス宛にご返信いたします。</p>

    <form class="contact-form" id="contact-form">
      <input type="hidden" name="access_key" value="e3b6cf3e-1af0-4a5d-9f76-a5e6cf9b6b97" />
      <input type="hidden" name="subject" value="【世界地図クイズ】お問い合わせがありました" />
      <input type="checkbox" name="botcheck" class="form-honeypot" tabindex="-1" autocomplete="off" />

      <div class="form-field">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" required autocomplete="name" />
      </div>

      <div class="form-field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>

      <div class="form-field">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">送信する</button>

      <div class="form-status" id="form-status"></div>
    </form>

    <p class="note">※ ご記入いただいた内容は、お問い合わせへの回答以外の目的では使用いたしません。</p>

    <nav class="page-footer-nav">
      <a href="index.html">地図に戻る</a>
      <a href="guide.html">使い方・国名の覚え方のコツ</a>
      <a href="privacy-policy.html">プライバシーポリシー</a>
    </nav>
  </div>

  <script>
    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('form-status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (form.access_key.value === 'ACCESS_KEY') {
        statusBox.textContent = '準備中です。しばらくしてから再度お試しください。';
        statusBox.className = 'form-status error show';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';
      statusBox.className = 'form-status';

      try {
        const formData = new FormData(form);
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: formData,
        });
        const result = await response.json();

        if (result.success) {
          statusBox.textContent = 'お問い合わせを送信しました。ご連絡ありがとうございます。';
          statusBox.className = 'form-status success show';
          form.reset();
        } else {
          statusBox.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
          statusBox.className = 'form-status error show';
        }
      } catch (err) {
        statusBox.textContent = '送信に失敗しました。通信環境をご確認のうえ、再度お試しください。';
        statusBox.className = 'form-status error show';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
      }
    });
  </script>
</body>
</html>
