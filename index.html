<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9V3PMEN30B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-9V3PMEN30B');

  <title>世界地図 — 国名暗記ツール</title>
  <meta name="description" content="白地図をクリックして国名を覚える無料の暗記ツール。クイズモードで実力チェックも。訪れた国は緑色にマークされ、進捗バーで達成率がひと目でわかります。登録不要・ブラウザだけですぐ遊べます。" />
  <meta property="og:title" content="世界地図 — 国名暗記ツール" />
  <meta property="og:description" content="白地図をクリックして国名を覚える無料の暗記ツール。クイズモードで実力チェックも。登録不要・ブラウザだけですぐ遊べます。" />
  <meta property="og:type" content="website" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="translations.js"></script>
  <style>
    /* ── Design tokens ───────────────────────── */
    :root {
      --bg:          #f0ede8;
      --ocean:       #c8dce8;
      --land:        #e8e2d8;
      --land-stroke: #b8b0a0;
      --visited:     #7ba99a;
      --visited-dk:  #5a8a7c;
      --hover:       #d4c8a8;
      --active:      #c4a855;
      --wrong:       #c85a3a;
      --wrong-dk:    #a8432a;
      --text-main:   #2a2520;
      --text-sub:    #7a736a;
      --panel-bg:    #ffffff;
      --panel-shadow:rgba(42,37,32,0.12);
      --accent:      #c4552a;   /* warm terra-cotta — the one bold choice */

      --font-display: 'Georgia', 'Times New Roman', serif;
      --font-body:    'Helvetica Neue', 'Arial', sans-serif;
      --font-mono:    'SF Mono', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: var(--panel-bg);
      box-shadow: 0 1px 0 rgba(0,0,0,0.08);
      flex-shrink: 0;
      gap: 16px;
    }

    .header-left h1 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      color: var(--text-main);
    }

    .header-left p {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 1px;
      letter-spacing: 0.04em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* ── Mode toggle ──────────────────────────── */
    .mode-toggle {
      display: flex;
      gap: 2px;
      background: var(--bg);
      padding: 3px;
      border-radius: 8px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 7px 14px;
      font-size: 0.76rem;
      font-family: var(--font-body);
      color: var(--text-sub);
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--panel-bg);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 1px 3px var(--panel-shadow);
    }

    .counter {
      text-align: right;
    }

    .counter .num {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
      line-height: 1;
    }

    .counter .label {
      font-size: 0.65rem;
      color: var(--text-sub);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .btn-reset {
      background: transparent;
      border: 1.5px solid var(--land-stroke);
      color: var(--text-sub);
      font-family: var(--font-body);
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }

    .btn-reset:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Quiz bar ─────────────────────────────── */
    #quiz-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 28px;
      background: var(--panel-bg);
      border-top: 1px solid rgba(0,0,0,0.06);
      flex-shrink: 0;
    }

    #quiz-bar.show {
      display: flex;
    }

    .quiz-progress {
      font-size: 0.72rem;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      white-space: nowrap;
      min-width: 64px;
    }

    .quiz-prompt {
      text-align: center;
      flex: 1;
    }

    .quiz-prompt .q-ja {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--text-main);
    }

    .quiz-prompt .q-en {
      font-size: 0.72rem;
      color: var(--text-sub);
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .quiz-score {
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: bold;
      white-space: nowrap;
      min-width: 64px;
      text-align: right;
    }

    .btn-skip {
      background: transparent;
      border: 1.5px solid var(--land-stroke);
      color: var(--text-sub);
      font-family: var(--font-body);
      font-size: 0.72rem;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-skip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Map area ─────────────────────────────── */
    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--ocean);
    }

    svg#map {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* country paths */
    .country {
      fill: var(--land);
      stroke: var(--land-stroke);
      stroke-width: 0.5px;
      transition: fill 0.18s ease;
    }

    .country:hover {
      fill: var(--hover);
    }

    .country.visited {
      fill: var(--visited);
      stroke: var(--visited-dk);
    }

    .country.visited:hover {
      fill: var(--visited-dk);
    }

    .country.active {
      fill: var(--active);
      stroke: #a08830;
    }

    /* quiz feedback states on the map */
    .country.quiz-correct {
      fill: var(--visited);
      stroke: var(--visited-dk);
    }

    .country.quiz-wrong {
      fill: var(--wrong);
      stroke: var(--wrong-dk);
    }

    .country.quiz-reveal {
      fill: var(--active);
      stroke: #a08830;
    }

    /* ── Tooltip / name card ─────────────────── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.15s, transform 0.15s;
    }

    #tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }

    .tooltip-inner {
      background: var(--panel-bg);
      border-radius: 8px;
      box-shadow: 0 4px 20px var(--panel-shadow), 0 0 0 1px rgba(0,0,0,0.06);
      padding: 14px 18px;
      min-width: 140px;
      text-align: center;
    }

    .tooltip-inner .ja {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--text-main);
      line-height: 1.3;
    }

    .tooltip-inner .en {
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.05em;
      margin-top: 3px;
    }

    /* ── Pinned name banner (bottom) ─────────── */
    #name-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 90;
      text-align: center;
    }

    #name-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #name-banner .banner-inner {
      background: var(--text-main);
      color: #fff;
      border-radius: 10px;
      padding: 12px 28px;
      display: inline-block;
    }

    #name-banner .banner-ja {
      font-family: var(--font-display);
      font-size: 1.35rem;
    }

    #name-banner .banner-en {
      font-size: 0.72rem;
      opacity: 0.65;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    /* ── Quiz feedback toast ──────────────────── */
    #quiz-feedback {
      position: fixed;
      top: 78px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
      z-index: 95;
    }

    #quiz-feedback.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #quiz-feedback .fb-inner {
      padding: 9px 22px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 14px var(--panel-shadow);
    }

    #quiz-feedback.correct .fb-inner {
      background: var(--visited-dk);
    }

    #quiz-feedback.wrong .fb-inner {
      background: var(--wrong-dk);
    }

    /* ── Progress bar ─────────────────────────── */
    #progress-bar-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 200;
      background: rgba(0,0,0,0.06);
    }

    #progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── Completion / setup / result overlays ─── */
    #complete-overlay,
    #quiz-setup-overlay,
    #quiz-result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(240,237,232,0.92);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    #complete-overlay.show,
    #quiz-setup-overlay.show,
    #quiz-result-overlay.show {
      display: flex;
    }

    .complete-card,
    .setup-card,
    .result-card {
      background: var(--panel-bg);
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 8px 40px var(--panel-shadow);
      max-width: 360px;
    }

    .complete-card .trophy {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .complete-card h2,
    .setup-card h2,
    .result-card h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .complete-card p,
    .setup-card p,
    .result-card p {
      color: var(--text-sub);
      font-size: 0.88rem;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    .btn-restart {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--font-body);
      font-size: 0.9rem;
      padding: 12px 32px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.15s;
    }

    .btn-restart:hover {
      background: #a8451f;
    }

    .quiz-length-options {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quiz-length-options button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--font-body);
      font-size: 0.85rem;
      padding: 11px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .quiz-length-options button:hover {
      background: #a8451f;
    }

    .result-score {
      font-family: var(--font-display);
      font-size: 2.4rem;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }

    .result-actions .btn-secondary {
      background: transparent;
      color: var(--text-sub);
      border: 1.5px solid var(--land-stroke);
      font-family: var(--font-body);
      font-size: 0.9rem;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.15s;
    }

    .result-actions .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Zoom controls ───────────────────────── */
    #zoom-controls {
      position: fixed;
      right: 16px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 80;
    }

    .zoom-btn {
      width: 32px;
      height: 32px;
      background: var(--panel-bg);
      border: 1.5px solid var(--land-stroke);
      border-radius: 4px;
      font-size: 1.1rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .zoom-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Footer ───────────────────────────────── */
    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 8px 16px;
      background: var(--panel-bg);
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    footer a {
      color: var(--text-sub);
      font-size: 0.72rem;
      text-decoration: none;
      margin: 0 10px;
      letter-spacing: 0.02em;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* ── Responsive ───────────────────────────── */
    @media (max-width: 600px) {
      header {
        padding: 10px 14px;
        flex-wrap: wrap;
      }
      .header-left h1 { font-size: 1rem; }
      .counter .num { font-size: 1.2rem; }
      #name-banner .banner-ja { font-size: 1.1rem; }
      #quiz-bar {
        padding: 8px 14px;
        flex-wrap: wrap;
      }
      .quiz-prompt .q-ja { font-size: 1.05rem; }
      .quiz-progress, .quiz-score { min-width: auto; }
    }
  </style>
</head>
<body>

  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

  <header>
    <div class="header-left">
      <h1>世界地図 — 国名暗記</h1>
      <p id="header-subtitle">国をクリックして名前を確認。訪れた国は緑に染まる。</p>
    </div>
    <div class="header-right">
      <div class="mode-toggle" id="mode-toggle">
        <button class="mode-btn active" id="mode-learn" type="button">暗記</button>
        <button class="mode-btn" id="mode-quiz" type="button">クイズ</button>
      </div>
      <div class="counter" id="counter-panel">
        <div class="num" id="visited-count">0</div>
        <div class="label">/ <span id="total-count">0</span> カ国 クリック済み</div>
      </div>
      <button class="btn-reset" id="btn-reset">リセット</button>
    </div>
  </header>

  <div id="quiz-bar">
    <div class="quiz-progress"><span id="quiz-index">1</span> / <span id="quiz-total">10</span> 問</div>
    <div class="quiz-prompt">
      <div class="q-ja" id="quiz-ja">—</div>
      <div class="q-en" id="quiz-en">—</div>
    </div>
    <div class="quiz-score">正解 <span id="quiz-score">0</span></div>
    <button class="btn-skip" id="quiz-skip" type="button">スキップ</button>
  </div>

  <div id="map-container">
    <svg id="map"></svg>
  </div>

  <!-- Floating tooltip (follows cursor, 暗記モードのみ) -->
  <div id="tooltip">
    <div class="tooltip-inner">
      <div class="ja" id="tt-ja"></div>
      <div class="en" id="tt-en"></div>
    </div>
  </div>

  <!-- Pinned banner after click (暗記モードのみ) -->
  <div id="name-banner">
    <div class="banner-inner">
      <div class="banner-ja" id="bn-ja"></div>
      <div class="banner-en" id="bn-en"></div>
    </div>
  </div>

  <!-- Quiz correct/incorrect toast -->
  <div id="quiz-feedback"><div class="fb-inner" id="quiz-feedback-text"></div></div>

  <!-- Zoom controls -->
  <div id="zoom-controls">
    <button class="zoom-btn" id="zoom-in" title="ズームイン">＋</button>
    <button class="zoom-btn" id="zoom-out" title="ズームアウト">−</button>
    <button class="zoom-btn" id="zoom-reset" title="全体表示" style="font-size:0.8rem;">⌂</button>
  </div>

  <!-- Completion overlay (暗記モード全カ国制覇) -->
  <div id="complete-overlay">
    <div class="complete-card">
      <div class="trophy">🌍</div>
      <h2>全カ国制覇！</h2>
      <p id="complete-msg"></p>
      <button class="btn-restart" id="btn-restart">もう一度チャレンジ</button>
    </div>
  </div>

  <!-- Quiz setup overlay -->
  <div id="quiz-setup-overlay">
    <div class="setup-card">
      <h2>クイズモード</h2>
      <p>表示された国名を見て、地図上でその国をクリックしてください。何問挑戦しますか？</p>
      <div class="quiz-length-options">
        <button data-count="10" type="button">10問</button>
        <button data-count="30" type="button">30問</button>
        <button data-count="all" type="button">全カ国</button>
      </div>
    </div>
  </div>

  <!-- Quiz result overlay -->
  <div id="quiz-result-overlay">
    <div class="result-card">
      <h2>結果発表</h2>
      <div class="result-score" id="result-score">0 / 0</div>
      <p id="result-message"></p>
      <div class="result-actions">
        <button class="btn-restart" id="quiz-retry" type="button">もう一度</button>
        <button class="btn-secondary" id="quiz-back-to-learn" type="button">暗記モードに戻る</button>
      </div>
    </div>
  </div>

  <footer>
    <a href="guide.html">使い方・国名の覚え方のコツ</a>
    <a href="privacy-policy.html">プライバシーポリシー</a>
    <a href="contact.html">お問い合わせ</a>
  </footer>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
const STORAGE_KEY = 'worldmap_visited_v1';
let visited = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let totalCountries = 0;
let bannerTimer = null;
let allFeatures = [];

// mode: 'learn' | 'quiz'
let mode = 'learn';

// quiz state
let quizQueue = [];
let quizIndex = 0;
let quizScore = 0;
let quizTotal = 0;
let quizTarget = null;
let quizLocked = false;
let quizAdvanceTimer = null;

// ─────────────────────────────────────────────
// D3 Setup
// ─────────────────────────────────────────────
const svg = d3.select('#map');
const container = document.getElementById('map-container');

const projection = d3.geoNaturalEarth1()
  .scale(160)
  .translate([0, 0]);   // will be recalculated on resize

const path = d3.geoPath().projection(projection);

// zoom
const zoom = d3.zoom()
  .scaleExtent([0.5, 10])
  .on('zoom', (event) => {
    g.attr('transform', event.transform);
  });

svg.call(zoom);

const g = svg.append('g');

// ocean background rect
svg.insert('rect', ':first-child')
   .attr('id', 'ocean-bg')
   .attr('fill', '#c8dce8');

// ─────────────────────────────────────────────
// Draw Map
// ─────────────────────────────────────────────
async function initMap() {
  const world = await d3.json('world.geojson');
  const features = world.features.filter(d => d.properties.name !== 'Antarctica');
  allFeatures = features;
  totalCountries = features.length;

  document.getElementById('total-count').textContent = totalCountries;
  updateCounter();
  updateProgressBar();

  g.selectAll('.country')
    .data(features)
    .join('path')
      .attr('class', d => {
        const base = 'country';
        return visited.has(d.properties.name) ? base + ' visited' : base;
      })
      .attr('d', path)
      .on('mouseenter', onMouseEnter)
      .on('mousemove', onMouseMove)
      .on('mouseleave', onMouseLeave)
      .on('click', onCountryClick);

  fitMap();
}

function fitMap() {
  const W = container.clientWidth;
  const H = container.clientHeight;

  projection
    .scale(Math.min(W / 6.3, H / 3.4))
    .translate([W / 2, H / 2]);

  svg
    .attr('width', W)
    .attr('height', H);

  d3.select('#ocean-bg')
    .attr('width', W)
    .attr('height', H);

  g.selectAll('.country').attr('d', path);

  svg.call(zoom.transform, d3.zoomIdentity);
}

window.addEventListener('resize', fitMap);

// ─────────────────────────────────────────────
// Interaction helpers
// ─────────────────────────────────────────────
const tooltip  = document.getElementById('tooltip');
const ttJa     = document.getElementById('tt-ja');
const ttEn     = document.getElementById('tt-en');
const banner   = document.getElementById('name-banner');
const bnJa     = document.getElementById('bn-ja');
const bnEn     = document.getElementById('bn-en');

function nameJa(en) {
  return COUNTRY_TRANSLATIONS[en] || en;
}

function positionTooltip(event) {
  const pad = 14;
  const TW = tooltip.offsetWidth  || 160;
  const TH = tooltip.offsetHeight || 70;
  let x = event.clientX + 18;
  let y = event.clientY - TH / 2;
  if (x + TW > window.innerWidth  - pad) x = event.clientX - TW - 14;
  if (y < pad)                           y = pad;
  if (y + TH > window.innerHeight - pad) y = window.innerHeight - TH - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function onMouseEnter(event, d) {
  if (mode === 'quiz') return; // クイズ中はヒントを出さない

  const en = d.properties.name;

  // クリック済みの国なら国名を表示、未クリックなら「？？？」を表示
  if (visited.has(en)) {
    ttJa.textContent = nameJa(en);
    ttEn.textContent = en;
  } else {
    ttJa.textContent = '？？？';
    ttEn.textContent = 'クリックで答えを表示';
  }

  positionTooltip(event);
  tooltip.classList.add('show');
  if (!this.classList.contains('active')) {
    this.style.cursor = 'pointer';
  }
}

function onMouseMove(event) {
  if (mode === 'quiz') return;
  positionTooltip(event);
}

function onMouseLeave() {
  tooltip.classList.remove('show');
}

function onCountryClick(event, d) {
  if (mode === 'quiz') {
    quizHandleClick.call(this, d);
  } else {
    onLearnClick.call(this, event, d);
  }
}

function onLearnClick(event, d) {
  const en = d.properties.name;
  const ja = nameJa(en);

  if (visited.has(en)) {
    // ── すでに回答済みの場合：未回答に戻す ──
    visited.delete(en);
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...visited]));
    d3.select(this).classed('visited', false).classed('active', false);

    // ツールチップを未回答表示に戻す
    ttJa.textContent = '？？？';
    ttEn.textContent = 'クリックで答えを表示';

    // 下部バナーを非表示にする
    banner.classList.remove('show');
    clearTimeout(bannerTimer);

  } else {
    // ── 未回答の場合：回答済みにする ──
    visited.add(en);
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...visited]));
    d3.select(this).classed('visited', true);

    // ツールチップと下部バナーに正解を表示
    ttJa.textContent = ja;
    ttEn.textContent = en;

    bnJa.textContent = ja;
    bnEn.textContent = en;
    banner.classList.add('show');

    // ハイライト表示
    d3.selectAll('.country').classed('active', false);
    d3.select(this).classed('active', true);

    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => {
      banner.classList.remove('show');
      d3.select(this).classed('active', false);
    }, 2600);

    checkComplete(ja);
  }

  // カウントとプログレスバーを更新
  updateCounter();
  updateProgressBar();
}
// ─────────────────────────────────────────────
// Counter & Progress (暗記モード)
// ─────────────────────────────────────────────
function updateCounter() {
  document.getElementById('visited-count').textContent = visited.size;
}

function updateProgressBar() {
  const pct = totalCountries > 0 ? (visited.size / totalCountries) * 100 : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function checkComplete(lastCountry) {
  if (visited.size >= totalCountries) {
    setTimeout(() => {
      document.getElementById('complete-msg').textContent =
        `${totalCountries} カ国すべてを制覇しました！`;
      document.getElementById('complete-overlay').classList.add('show');
    }, 600);
  }
}

// ─────────────────────────────────────────────
// Mode switching
// ─────────────────────────────────────────────
const modeLearnBtn   = document.getElementById('mode-learn');
const modeQuizBtn    = document.getElementById('mode-quiz');
const counterPanel   = document.getElementById('counter-panel');
const btnResetEl     = document.getElementById('btn-reset');
const quizBar        = document.getElementById('quiz-bar');
const headerSubtitle = document.getElementById('header-subtitle');
const quizFeedback     = document.getElementById('quiz-feedback');
const quizFeedbackText = document.getElementById('quiz-feedback-text');
const quizSetupOverlay = document.getElementById('quiz-setup-overlay');
const quizResultOverlay = document.getElementById('quiz-result-overlay');

function setMode(next) {
  mode = next;
  const isQuiz = mode === 'quiz';

  modeLearnBtn.classList.toggle('active', !isQuiz);
  modeQuizBtn.classList.toggle('active', isQuiz);
  counterPanel.style.display = isQuiz ? 'none' : '';
  btnResetEl.style.display = isQuiz ? 'none' : '';
  quizBar.classList.toggle('show', isQuiz);

  headerSubtitle.textContent = isQuiz
    ? '表示された国名を地図上でクリックしよう。'
    : '国をクリックして名前を確認。訪れた国は緑に染まる。';

  tooltip.classList.remove('show');
  banner.classList.remove('show');
  clearTimeout(bannerTimer);
  g.selectAll('.country').classed('quiz-correct', false).classed('quiz-wrong', false).classed('quiz-reveal', false);
}

modeLearnBtn.addEventListener('click', () => {
  clearTimeout(quizAdvanceTimer);
  setMode('learn');
});

modeQuizBtn.addEventListener('click', () => {
  quizSetupOverlay.classList.add('show');
});

// ─────────────────────────────────────────────
// Quiz mode
// ─────────────────────────────────────────────
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

document.querySelectorAll('.quiz-length-options button').forEach(btn => {
  btn.addEventListener('click', () => {
    quizSetupOverlay.classList.remove('show');
    startQuiz(btn.dataset.count);
  });
});

function startQuiz(count) {
  setMode('quiz');

  const pool = shuffle(allFeatures.map(f => f.properties.name));
  quizQueue = count === 'all' ? pool : pool.slice(0, Math.min(Number(count), pool.length));
  quizTotal = quizQueue.length;
  quizIndex = 0;
  quizScore = 0;
  quizLocked = false;

  document.getElementById('quiz-total').textContent = quizTotal;
  document.getElementById('quiz-score').textContent = '0';

  showQuizQuestion();
}

function showQuizQuestion() {
  g.selectAll('.country').classed('quiz-correct', false).classed('quiz-wrong', false).classed('quiz-reveal', false);

  quizTarget = quizQueue[quizIndex];
  quizLocked = false;

  document.getElementById('quiz-index').textContent = quizIndex + 1;
  document.getElementById('quiz-ja').textContent = nameJa(quizTarget);
  document.getElementById('quiz-en').textContent = quizTarget;
}

function quizHandleClick(d) {
  if (mode !== 'quiz' || quizLocked) return;

  const en = d.properties.name;

  if (en === quizTarget) {
    quizLocked = true;
    quizScore++;
    document.getElementById('quiz-score').textContent = quizScore;
    d3.select(this).classed('quiz-correct', true);
    showQuizFeedback(true, '正解！');

    clearTimeout(quizAdvanceTimer);
    quizAdvanceTimer = setTimeout(advanceQuiz, 850);
  } else {
    d3.select(this).classed('quiz-wrong', true);
    showQuizFeedback(false, `違います（${nameJa(en)}）`);
    setTimeout(() => d3.select(this).classed('quiz-wrong', false), 400);
  }
}

function showQuizFeedback(correct, message) {
  quizFeedback.classList.remove('correct', 'wrong');
  quizFeedback.classList.add(correct ? 'correct' : 'wrong');
  quizFeedbackText.textContent = message;
  quizFeedback.classList.add('show');
  clearTimeout(quizFeedback._hideTimer);
  quizFeedback._hideTimer = setTimeout(() => quizFeedback.classList.remove('show'), correct ? 800 : 650);
}

document.getElementById('quiz-skip').addEventListener('click', () => {
  if (mode !== 'quiz' || quizLocked) return;
  quizLocked = true;

  g.selectAll('.country')
    .filter(d => d.properties.name === quizTarget)
    .classed('quiz-reveal', true);

  showQuizFeedback(false, `正解は「${nameJa(quizTarget)}」でした`);

  clearTimeout(quizAdvanceTimer);
  quizAdvanceTimer = setTimeout(advanceQuiz, 1100);
});

function advanceQuiz() {
  quizIndex++;
  if (quizIndex >= quizTotal) {
    showQuizResult();
    return;
  }
  showQuizQuestion();
}

function showQuizResult() {
  quizBar.classList.remove('show');
  const pct = quizTotal > 0 ? Math.round((quizScore / quizTotal) * 100) : 0;
  document.getElementById('result-score').textContent = `${quizScore} / ${quizTotal}`;
  document.getElementById('result-message').textContent = `正答率 ${pct}%`;
  quizResultOverlay.classList.add('show');
}

document.getElementById('quiz-retry').addEventListener('click', () => {
  quizResultOverlay.classList.remove('show');
  const count = quizTotal === allFeatures.length ? 'all' : quizTotal;
  startQuiz(count);
});

document.getElementById('quiz-back-to-learn').addEventListener('click', () => {
  quizResultOverlay.classList.remove('show');
  setMode('learn');
});

// ─────────────────────────────────────────────
// Controls (暗記モード)
// ─────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('クリック履歴をリセットしますか？')) return;
  visited.clear();
  localStorage.removeItem(STORAGE_KEY);
  d3.selectAll('.country').classed('visited', false).classed('active', false);
  updateCounter();
  updateProgressBar();
  banner.classList.remove('show');
});

document.getElementById('btn-restart').addEventListener('click', () => {
  document.getElementById('complete-overlay').classList.remove('show');
  visited.clear();
  localStorage.removeItem(STORAGE_KEY);
  d3.selectAll('.country').classed('visited', false).classed('active', false);
  updateCounter();
  updateProgressBar();
});

document.getElementById('zoom-in').addEventListener('click', () => {
  svg.transition().duration(300).call(zoom.scaleBy, 1.6);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  svg.transition().duration(300).call(zoom.scaleBy, 0.625);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
});

// ─────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────
initMap();
</script>
</body>
</html>
